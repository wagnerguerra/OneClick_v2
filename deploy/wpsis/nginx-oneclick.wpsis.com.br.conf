# OneClick — vhost da segunda instalação
#
# Instalação:
#   1. copiar para /etc/nginx/sites-available/oneclick.wpsis.com.br
#   2. ln -s ../sites-available/oneclick.wpsis.com.br /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx      (com o bloco 80 ainda em pé)
#   4. certbot --nginx -d oneclick.wpsis.com.br
#
# O certbot reescreve este arquivo: ele acrescenta o bloco 443 com os caminhos
# do certificado e converte o bloco 80 em redirect. Por isso aqui só existe o
# 80 — subir com um bloco 443 antes de o certificado existir faz o nginx
# recusar a recarga e derruba os OUTROS sites do host junto.

server {
    listen 80;
    listen [::]:80;
    server_name oneclick.wpsis.com.br;

    access_log /var/log/nginx/oneclick-wpsis-access.log;
    error_log  /var/log/nginx/oneclick-wpsis-error.log;

    # Anexos, certificados e dumps — mesmo teto da outra instalação.
    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        default_type "text/plain";
    }

    # SSE (notificações, logs ao vivo). Precisa vir ANTES de /api/ — o nginx
    # escolhe location por especificidade, e a regex ganha do prefixo. Sem
    # buffering e com timeout longo, senão a conexão cai a cada 60s e o front
    # fica reconectando.
    location ~ ^/api/.*/events {
        proxy_pass http://127.0.0.1:4101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4101/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /trpc/ {
        proxy_pass http://127.0.0.1:4101/trpc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Next.js (standalone)
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
