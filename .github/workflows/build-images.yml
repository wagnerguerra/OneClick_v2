name: Build & Push imagens (API + Web)

# ──────────────────────────────────────────────────────────────────────────
# Builda as imagens Docker da API e do Web FORA da VPS (no runner do GitHub) e
# publica no GitHub Container Registry (ghcr.io). Objetivo: tirar o `next build`
# (pesado de RAM) da produção — a VPS passa a só dar `docker pull` + `up`.
#
# Trigger: todo push na `main` (o trunk desde 30/06) e tambem manual. Precisa
# ser automatico: o deploy publica um SHA e, logo em seguida, quer a imagem
# daquele SHA — se o build so acontecesse a mao, o deploy encontraria `:latest`
# de um commit anterior e publicaria o codigo errado sem avisar.
#
# NAO ha bloco `concurrency` de proposito. Cancelar o build antigo quando chega
# push novo economizaria minutos, mas deixaria SHAs da main sem imagem — e e
# justamente por SHA que o deploy vai puxar.
#
# PRÉ-REQUISITOS (configurar uma vez no GitHub → Settings → Secrets and
# variables → Actions → aba "Variables"):
#   NEXT_PUBLIC_API_URL  → mesmo valor que o Service Manager passa hoje no build
#                          do web (destino do rewrite /be/* → API).
#   NEXT_PUBLIC_APP_URL  → URL pública do app (ex.: https://app.oneclick.central-rnc.com.br)
# O push pro ghcr.io usa o GITHUB_TOKEN embutido — nenhum secret extra.
#
# CONSUMIR NA VPS — puxar por SHA e RETAGUEAR com o nome local:
#   # 1x: autenticar no ghcr (PAT com read:packages, ou torne o pacote publico)
#   echo "$GHCR_PAT" | docker login ghcr.io -u wagnerguerra --password-stdin
#   # a cada deploy, no lugar do `docker compose build`:
#   docker pull ghcr.io/wagnerguerra/oneclick-api:<sha>
#   docker tag  ghcr.io/wagnerguerra/oneclick-api:<sha> oneclick-api:latest
#
# Retaguear para `oneclick-api:latest` (o nome que o compose de producao ja usa)
# em vez de apontar o compose para o ghcr: assim TUDO que vem depois continua
# funcionando sem tocar — inclusive o `docker run ... oneclick-api:latest` que
# aplica o `prisma db push`. No compose de producao basta remover o bloco
# `build:`; a linha `image:` fica como esta.
#
# Puxar por <sha> e nao por `latest` porque `latest` e uma corrida: dois deploys
# proximos e voce publica a imagem do outro commit sem perceber.
# Detalhes em docs/CI-BUILD-IMAGENS.md.
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: wagnerguerra

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/oneclick-api:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/oneclick-api:${{ github.sha }}
          # Cache no REGISTRY, nao no Actions. O cache do Actions tem teto de
          # 10 GB por repositorio; com `mode=max` guardando toda camada
          # intermediaria de duas imagens Node, os dois escopos passavam do
          # teto e se despejavam por LRU. O sintoma era o build da API oscilar
          # entre 21s (cache quente) e 298s (cache frio) para o MESMO tipo de
          # commit. No ghcr nao ha esse teto, e cada imagem tem a sua tag de
          # cache -- param de brigar por espaco.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/oneclick-api:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/oneclick-api:buildcache,mode=max

  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/oneclick-web:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/oneclick-web:${{ github.sha }}
          # Cache no REGISTRY, nao no Actions. O cache do Actions tem teto de
          # 10 GB por repositorio; com `mode=max` guardando toda camada
          # intermediaria de duas imagens Node, os dois escopos passavam do
          # teto e se despejavam por LRU. O sintoma era o build da API oscilar
          # entre 21s (cache quente) e 298s (cache frio) para o MESMO tipo de
          # commit. No ghcr nao ha esse teto, e cada imagem tem a sua tag de
          # cache -- param de brigar por espaco.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/oneclick-web:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/oneclick-web:buildcache,mode=max
